name: udir
services:
  service-bus-explorer:
    build:
      context: ./
      dockerfile: Dockerfile
    image: udir/servicebus-explorer:1.2.4
    container_name: servicebus-explorer
    restart: unless-stopped
    ports:
      - "9010:9010"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "9010"
    networks:
      - udir_default

networks:
  udir_default:
    external: true
